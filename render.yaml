# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/GabKrouk/Fiole
services:
  - type: web
    name: fiole
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FIOLE_DATABASE_URL
        fromDatabase:
          name: fiole-db
          property: connectionString
      - key: FIOLE_COOKIE_SECURE
        value: "1"

databases:
  - name: fiole-db
    plan: free
    databaseName: fiole
    user: fiole
